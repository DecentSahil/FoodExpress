

services:

  frontend:
    image: decent8/react-frontend:1.9
    container_name: react-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8085
    depends_on:
      - api-gateway
    networks:
      - microservices-network

  eureka-server:
    image: decent8/eureka-server:1.0
    container_name: eureka-server
    ports:
      - "8761:8761"
    environment:
      - SERVER_PORT=8761
      - EUREKA_HOSTNAME=eureka-server
    networks:
      - microservices-network

  api-gateway:
    image: decent8/api-gateway:1.9
    container_name: api-gateway
    ports:
      - "8085:8080"
    environment:
      - SERVER_PORT=8080
      - EUREKA_URL=http://eureka-server:8761/eureka
    depends_on:
      - eureka-server
    networks:
      - microservices-network

  user-service:
    image: decent8/user-service:1.9
    container_name: user-service
    ports:
      - "8086:8080"
    environment:
      - SERVER_PORT=8080
      - DB_HOST=mysql_db
      - DB_PORT=3306
      - DB_NAME=user_db
      - DB_USER=root
      - DB_PASSWORD=1234
      - EUREKA_INSTANCE_HOSTNAME=user-service
      - EUREKA_URL=http://eureka-server:8761/eureka
    depends_on:
      - mysql_db
      - eureka-server
    networks:
      - microservices-network
    volumes:
      - ./uploads:/app/uploads
  auth-service:
    image: decent8/auth-service:1.9
    container_name: auth-service
    ports:
      - "8081:8080"
    environment:
      - SERVER_PORT=8080
      - DB_HOST=mysql_db
      - DB_PORT=3306
      - DB_NAME=auth_db
      - DB_USER=root
      - DB_PASSWORD=1234
      - EUREKA_INSTANCE_HOSTNAME=auth-service
      - EUREKA_URL=http://eureka-server:8761/eureka
      - SECURITY_LOG_LEVEL=DEBUG
    depends_on:
      - mysql_db
      - eureka-server
    networks:
      - microservices-network

  cart-service:
    image: decent8/cart-service:1.9
    container_name: cart-service
    ports:
      - "8082:8080"
    environment:
      - SERVER_PORT=8080
      - DB_HOST=mysql_db
      - DB_PORT=3306
      - DB_NAME=cart_db
      - DB_USER=root
      - DB_PASSWORD=1234
      - EUREKA_INSTANCE_HOSTNAME=cart-service
      - EUREKA_URL=http://eureka-server:8761/eureka
    depends_on:
      - mysql_db
      - eureka-server
    networks:
      - microservices-network

  order-service:
    image: decent8/order-service:1.9
    container_name: order-service
    ports:
      - "8084:8080"
    environment:
      - SERVER_PORT=8080
      - DB_HOST=mysql_db
      - DB_PORT=3306
      - DB_NAME=order_db
      - DB_USER=root
      - DB_PASSWORD=1234
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - EUREKA_INSTANCE_HOSTNAME=order-service
      - EUREKA_URL=http://eureka-server:8761/eureka
    depends_on:
      - mysql_db
      - kafka
      - eureka-server
    networks:
      - microservices-network

  restaurant-service:
    image: decent8/restaurant-service:1.9
    container_name: restaurant-service
    ports:
      - "8087:8080"
    environment:
      - SERVER_PORT=8080
      - DB_HOST=mysql_db
      - DB_PORT=3306
      - DB_NAME=restaurant_db
      - DB_USER=root
      - DB_PASSWORD=1234
      - ELASTICSEARCH_URIS=http://elasticsearch:9200
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - EUREKA_INSTANCE_HOSTNAME=restaurant-service
      - EUREKA_URL=http://eureka-server:8761/eureka
    depends_on:
      - mysql_db
      - kafka
      - eureka-server
      - elasticsearch
    networks:
      - microservices-network
    volumes:
      - ./uploads:/app/uploads

  notification-service:
    image: decent8/notification-service:1.9
    container_name: notification-service
    ports:
      - "8083:8080"
    environment:
      - SERVER_PORT=8080
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - EUREKA_INSTANCE_HOSTNAME=notification-service
      - EUREKA_URL=http://eureka-server:8761/eureka
      - MAIL_USERNAME=sahilrohit789@gmail.com
      - MAIL_PASSWORD=ssqpyeavnimphpjm

    depends_on:
      - kafka
      - eureka-server
    networks:
      - microservices-network

  mysql_db:
    image: mysql:8.0
    container_name: mysql_db
    ports:
      - "3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=1234
      - MYSQL_ROOT_HOST=%
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - microservices-network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: elasticsearch
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:9200 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - microservices-network
    volumes:
      - elastic_data:/usr/share/elasticsearch/data
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    container_name: zookeeper
    environment:
      - ZOOKEEPER_CLIENT_PORT=2181
    networks:
      - microservices-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      - KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1

    networks:
      - microservices-network

volumes:
  mysql_data:
  elastic_data:
  kafka_data:
  zookeeper_data:
  uploads_data:

networks:
  microservices-network:
    driver: bridge